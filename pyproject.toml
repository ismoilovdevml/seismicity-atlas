[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seisatlas"
version = "0.5.0.post1"
description = "Magnitude of completeness and Gutenberg-Richter b-value with uncertainty for any earthquake catalogue (method of the Global Seismicity Atlas)"
readme = "src/seisatlas/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Otabek Ismoilov" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]
keywords = ["seismology", "b-value", "magnitude of completeness", "Gutenberg-Richter", "earthquake catalogue"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://seismicityatlas.org/"
Source = "https://github.com/ismoilovdevml/seismicity-atlas"
Paper = "https://doi.org/10.31223/X5X23M"
Archive = "https://doi.org/10.5281/zenodo.24228387"

[project.scripts]
seisatlas = "seisatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
