name: Update monitor

# Daily refresh of the Sequence Monitor (the "Ongoing" view): a descriptive summary of the M >= 7 aftershock
# sequences of the last 365 days. Queries ComCat (one request per sequence, 1 s apart), rebuilds site/data/monitor,
# checks it, runs the monitor tests and commits the data to main. Nothing is committed if any step fails.
# Not a forecast: see docs/monitor.md.

on:
  schedule:
    # GitHub delays scheduled runs under load (hours) and may drop some, so try every 3 hours; the freshness gate
    # below turns all but the first due run of the day into a no-op. Off the top of the hour on purpose.
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-monitor
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ismoilovdevml/seismicity-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Scheduled runs only rebuild when the committed data is at least MIN_AGE_H hours old; manual runs always do.
      - name: Freshness gate
        id: gate
        env:
          MIN_AGE_H: "20"
          EVENT: ${{ github.event_name }}
        run: |
          python -I - <<'PY'
          import json, os
          from datetime import datetime, timezone
          run = True
          if os.environ["EVENT"] == "schedule":
              try:
                  gen = json.load(open("site/data/monitor/index.json"))["generated_utc"]
                  age_h = (datetime.now(timezone.utc) - datetime.fromisoformat(gen.replace("Z", "+00:00"))).total_seconds() / 3600
                  run = age_h >= float(os.environ["MIN_AGE_H"])
                  print(f"monitor data generated {gen}, {age_h:.1f} h ago -> {'rebuild' if run else 'skip'}")
              except Exception as exc:  # unreadable index: rebuild rather than stall
                  print(f"freshness check failed ({exc}); rebuilding")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Restore the tectonic-regime grid cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/opensha
          key: monitor-opensha-20431f4

      - name: Fetch ComCat and build the monitor
        if: steps.gate.outputs.run == 'true'
        run: python -I scripts/monitor/build_monitor.py

      - name: Check the monitor data
        if: steps.gate.outputs.run == 'true'
        run: python -I scripts/monitor/check_monitor.py

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -I -m pytest -q -p no:cacheprovider tests/test_monitor.py

      # Browser binaries are cached per Playwright version; the system libraries still come from apt.
      - name: Cache the Playwright browser
        if: steps.gate.outputs.run == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.65.1-chromium

      - name: Browser tests of the Ongoing view (Chromium)
        if: steps.gate.outputs.run == 'true'
        env:
          PW_CACHED: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          python -m pip install playwright==1.65.1 pytest==9.2.0
          if [ "$PW_CACHED" = "true" ]; then python -m playwright install-deps chromium; else python -m playwright install --with-deps chromium; fi
          python -m pytest -q -p no:cacheprovider tests/e2e/test_monitor.py

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "ismoilovdevml"
          git config user.email "107093598+ismoilovdevml@users.noreply.github.com"
          git add -A site/data/monitor
          if git diff --cached --quiet -- site/data/monitor; then
            echo "No change in site/data/monitor; nothing committed."
            exit 0
          fi
          CUTOFF=$(python -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["data_cutoff_utc"])' site/data/monitor/index.json)
          git commit -m "Update ongoing sequences to cut-off $CUTOFF"
          git pull --rebase origin main
          git push origin HEAD:main
