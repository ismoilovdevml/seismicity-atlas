name: Test site

# Browser tests for the static site. This workflow only reads the repository: it builds nothing and deploys nothing.

on:
  push:
    paths:
      - "site/**"
      - "tests/e2e/**"
      - ".github/workflows/test-site.yml"
  pull_request:
    paths:
      - "site/**"
      - "tests/e2e/**"
      - ".github/workflows/test-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests run Chromium (the required engine). Firefox and WebKit run only on a manual
        # dispatch: headless Firefox on the Ubuntu runner logs a GPU-related console error that does not occur on
        # desktop Firefox (see docs/known-issues.md), and a failed optional job would mark every commit red.
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and pytest
        run: python -m pip install playwright==1.65.1 pytest==9.2.0
      - name: Install the browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run the browser tests
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: python -m pytest tests/e2e -q -p no:cacheprovider
