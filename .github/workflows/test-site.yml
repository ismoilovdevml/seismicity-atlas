name: Test site

# Browser tests for the static site. This workflow only reads the repository: it builds nothing and deploys nothing.

on:
  push:
    paths:
      - "site/**"
      - "tests/e2e/**"
      - ".github/workflows/test-site.yml"
  pull_request:
    paths:
      - "site/**"
      - "tests/e2e/**"
      - ".github/workflows/test-site.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.65.1"

concurrency:
  group: test-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests run Chromium (the required engine). Firefox and WebKit run only on a manual
        # dispatch: headless Firefox on the Ubuntu runner logs a GPU-related console error that does not occur on
        # desktop Firefox (see docs/known-issues.md), and a failed optional job would mark every commit red.
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/test-site.yml
      - name: Install Playwright and pytest
        run: python -m pip install playwright==${{ env.PLAYWRIGHT_VERSION }} pytest==9.2.0
      # Browser binaries (~150 MB) are cached per Playwright version; the system libraries still come from apt.
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Install the browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Install the browser's system libraries (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps ${{ matrix.browser }}
      - name: Run the browser tests
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: python -m pytest tests/e2e -q -p no:cacheprovider
