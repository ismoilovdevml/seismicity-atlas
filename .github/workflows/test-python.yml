name: Tests

# Every Python test outside tests/e2e on every push and pull request: the data contract, README and version
# consistency, SEO pages, interface strings, the browser analysis against the Python package (Node.js), the monitor,
# rating and deficit checks. Tests that need the gitignored data/ pipeline cache skip themselves
# (pytest.mark.skipif / pytest.skip), so this job needs no download. Browser tests: test-site.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Tests (without tests/e2e)
        run: python -m pytest -q -p no:cacheprovider -rs tests --ignore=tests/e2e
