name: Test Python package

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "tests/test_package.py"
      - "tests/test_seislib.py"
      - ".github/workflows/test-package.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package from the checkout
        run: python -m pip install . pytest==9.2.0
      - name: Command line works
        run: seisatlas --version
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tests/test_package.py tests/test_seislib.py
