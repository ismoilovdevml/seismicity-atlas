name: Publish Python package to PyPI

# Trusted Publishing (OpenID Connect): PyPI trusts this workflow of this repository, so no API token is stored.
# PyPI side: project "seisatlas", publisher = GitHub ismoilovdevml/seismicity-atlas, workflow publish-pypi.yml.
# Runs on a published GitHub release (the tag must equal the package version) or by hand.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version check (tag, pyproject and scripts/release.json agree)
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          r=$(python -c "import json;print(json.load(open('scripts/release.json'))['version'])")
          test "$v" = "$r" || { echo "pyproject $v != release.json $r"; exit 1; }
          if [ "${{ github.event_name }}" = "release" ]; then test "v$v" = "${{ github.event.release.tag_name }}" || { echo "tag mismatch"; exit 1; }; fi
      - name: Build sdist and wheel
        run: python -m pip install build==1.3.0 && python -m build
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl pytest==9.2.0
          seisatlas --version
          python -m pytest -q -p no:cacheprovider tests/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
